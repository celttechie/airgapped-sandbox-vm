#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.local
manage_etc_hosts: true

package_update: false
package_upgrade: false

users:
  - name: ${admin_username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [sudo, kvm, libvirt]
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

bootcmd:
  - systemctl enable --now qemu-guest-agent || true

write_files:
  - path: /etc/modules-load.d/kvm.conf
    content: |
      kvm

runcmd:
  - modprobe kvm || true
  - modprobe kvm_intel 2>/dev/null || modprobe kvm_amd 2>/dev/null || true
  - chmod 666 /dev/kvm || true
  - systemctl enable --now qemu-guest-agent libvirtd 2>/dev/null || true
